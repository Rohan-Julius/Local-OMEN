# Held-out evaluation set (production plan Phase 6): 24 labeled chunks, 8 per
# class. NEVER used for tuning: not for the similarity threshold, not for
# prompt wording, not for incidents.yaml surface forms. If a result here
# looks bad, report it; do not edit a prompt or a threshold until it looks
# better and then report the same file again. Tuning data lives in
# fixtures/calibration.yaml.
#
# Written in different domains from the calibration set (which covers a
# permission lookup, a DB reconnect loop, a login log line, seat booking, a
# thumbnail cache, stock counts and small utilities): this set uses API
# tokens, webhooks, archive storage, coupons, chat rooms, reports, sensor
# data, billing clocks, and so on.
#
# Honesty rules for every entry:
# - true_match: the code really shares the mechanism of `target_ref`
#   (see incidents.yaml), so a reviewer who knew that incident would flag it.
# - hard_negative: shares vocabulary or shape with an incident, but the
#   mechanism is absent: either it is already prevented in the code, or it
#   cannot occur there.
# - unrelated: nothing to do with any incident mechanism.
# Each entry has a unique file_path and none of this code appears in
# omen/prompts/ (tests/test_evaluation.py checks both).

