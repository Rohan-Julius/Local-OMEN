name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: unit tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11"]
    env:
      # Belt and braces with omen/vectors.py: Chroma must never phone home.
      ANONYMIZED_TELEMETRY: "FALSE"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      # Unit tier only: CI has no Ollama, so `live` tests are deselected
      # (they would also be skipped by tests/conftest.py).
      - name: Test
        run: pytest -m "not live" --cov=omen --cov-report=term
